name: Test and deploy

on:
  push:
    branches: [main]
    # A release tag rebuilds the commit already live, so its footer shows the clean version.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for `git describe` in the build script.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - id: upload
        uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages deployment API, called directly rather than through actions/deploy-pages: that action
      # sends the commit SHA as the build version, and Pages keeps the first deploy of a version, so a
      # release tag on a commit its merge already deployed would change nothing (ADR 0006).
      - id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          oidc_token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          deployment=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$ARTIFACT_ID" \
            -f pages_build_version="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -f oidc_token="$oidc_token")
          echo "page_url=$(jq -r .page_url <<<"$deployment")" >> "$GITHUB_OUTPUT"
          status_url=$(jq -r .status_url <<<"$deployment")
          for _ in $(seq 120); do
            status=$(gh api "$status_url" --jq .status)
            echo "Pages deployment: $status"
            case $status in
              succeed) exit 0 ;;
              *failed* | *cancelled* | *error* | *lost*) exit 1 ;;
            esac
            sleep 5
          done
          echo "Pages deployment timed out" && exit 1
