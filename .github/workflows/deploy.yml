name: Test and deploy

on:
  push:
    branches: [main]
    # A release tag made by hand rebuilds the commit already live, so its footer shows the clean version.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # A merged pull request labelled `release: patch|minor|major` is released before the build, so the
  # build already carries the new version (ADR 0006). A tag made with this token starts no workflow.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/release-label.sh release "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    # Runs when release is skipped (pull requests, tags), but not when it failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for `git describe` in the build script.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist

  # Pages publishes the gh-pages branch, which holds only the latest build as a single commit. Each
  # deploy is a new commit there, so a release tag's rebuild of a commit its merge already deployed
  # still goes live; deploying an artifact can't do that, because Pages takes one per source commit
  # (ADR 0006).
  deploy:
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One deploy at a time, in order, so a merge's deploy can't land after its release tag's.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Push the build to gh-pages
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Deploy $GITHUB_REF_NAME (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
