<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3.9in" height="2.5in" viewBox="0 0 390 250">
  <!-- Troops record card. 1 viewBox unit = 0.01 inch. Prints 8-up (2 x 4) on letter. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Roboto+Slab:wght@600&amp;display=swap');
    text { font-family: 'Alfa Slab One', 'Rockwell Extra Bold', Rockwell, Georgia, serif; fill: #000; }
    .lbl { font-size: 12px; }
    .hdr { font-size: 9px; }
    .sm { font-size: 7px; }
    .num { font-size: 10px; text-anchor: middle; }
    .title { font-size: 28px; text-anchor: middle; letter-spacing: 1px; }
    .box { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .bar { fill: #b4b4b4; stroke: #000; stroke-width: 1.2; }
    .frame { fill: none; stroke: #000; stroke-width: 1.8; }
    .gl { stroke: #000; stroke-width: 0.6; }
    .val { font-family: 'Roboto Slab', Georgia, serif; font-weight: 600; font-size: 12px; fill: #1a1a1a; }
    .crossed { fill: #555; opacity: 0.45; }
  </style>

  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="390" height="250" rx="4"/></clipPath>

    <!-- Stone texture. SVG filters don't survive svg2pdf, so for PDF export
         this will be swapped for a pre-rendered PNG of the same look. -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="4"/>
      <feColorMatrix type="matrix"
        values="0.6 0.6 0 0 0.02
                0.6 0.6 0 0 0.03
                0.6 0.6 0 0 0.05
                0    0    0 0 1"/>
    </filter>
    <filter id="streaks" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.09" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.12
                0 0 0 0 0.12
                0 0 0 0 0.13
                4.5 0 0 0 -1.9"/>
    </filter>
  </defs>

  <!-- ===== Background texture + outer frame ===== -->
  <g id="texture" clip-path="url(#cardClip)">
    <rect x="0" y="0" width="390" height="250" filter="url(#mottle)"/>
    <g transform="rotate(-38 195 125)">
      <rect x="-180" y="-290" width="750" height="830" filter="url(#streaks)"/>
    </g>
    <!-- title panel backdrop (its outline is drawn below) -->
    <rect x="12" y="12" width="156" height="38" fill="#cfcfcf"/>
    <rect x="12" y="12" width="156" height="38" filter="url(#mottle)" opacity="0.35"/>
  </g>
  <rect x="1" y="1" width="388" height="248" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- ===== Title + BP ===== -->
  <rect x="12" y="12" width="156" height="38" fill="none" stroke="#000" stroke-width="1.2"/>
  <text class="title" x="91" y="42" style="fill:#fff">TROOPS</text>
  <text class="title" x="90" y="41">TROOPS</text>

  <rect class="box" x="172" y="12" width="78" height="38"/>
  <text class="lbl" x="176" y="25">B<tspan font-size="9">P</tspan>:</text>

  <!-- ===== Info column ===== -->
  <rect class="box" x="254" y="12"    width="124" height="45.2"/>
  <rect class="box" x="254" y="57.2"  width="124" height="45.2"/>
  <rect class="box" x="254" y="102.4" width="124" height="45.2"/>
  <rect class="box" x="254" y="147.6" width="124" height="45.2"/>
  <rect class="box" x="254" y="192.8" width="124" height="45.2"/>
  <text class="lbl" x="258" y="25">NAME:</text>
  <text class="lbl" x="258" y="70.2">TYPE:</text>
  <text class="lbl" x="258" y="115.4">M<tspan font-size="9">V</tspan>:</text>
  <text class="lbl" x="258" y="160.6">T<tspan font-size="9">P</tspan>:</text>
  <text class="lbl" x="258" y="205.8">S<tspan font-size="9">V</tspan>:</text>
  <rect class="frame" x="254" y="12" width="124" height="226"/>

  <!-- ===== Strength tracker ===== -->
  <!-- cells: columns x=12..250 (10 x 23.8), rows y=68..88.5, 88.5..109 -->
  <rect class="box" x="12" y="54" width="238" height="55"/>
  <rect class="bar" x="12" y="54" width="238" height="14"/>
  <text class="hdr" x="131" y="64.5" text-anchor="middle">STRENGTH TRACKER</text>
  <path class="gl" stroke-width="0.9" d="
    M35.8 68V109 M59.6 68V109 M83.4 68V109 M107.2 68V109 M131 68V109
    M154.8 68V109 M178.6 68V109 M202.4 68V109 M226.2 68V109 M12 88.5H250"/>
  <g>
    <text class="num" x="23.9"  y="82.5">1</text>
    <text class="num" x="47.7"  y="82.5">2</text>
    <text class="num" x="71.5"  y="82.5">3</text>
    <text class="num" x="95.3"  y="82.5">4</text>
    <text class="num" x="119.1" y="82.5">5</text>
    <text class="num" x="142.9" y="82.5">6</text>
    <text class="num" x="166.7" y="82.5">7</text>
    <text class="num" x="190.5" y="82.5">8</text>
    <text class="num" x="214.3" y="82.5">9</text>
    <text class="num" x="238.1" y="82.5">10</text>
  </g>
  <g>
    <text class="num" x="23.9"  y="103">11</text>
    <text class="num" x="47.7"  y="103">12</text>
    <text class="num" x="71.5"  y="103">13</text>
    <text class="num" x="95.3"  y="103">14</text>
    <text class="num" x="119.1" y="103">15</text>
    <text class="num" x="142.9" y="103">16</text>
    <text class="num" x="166.7" y="103">17</text>
    <text class="num" x="190.5" y="103">18</text>
    <text class="num" x="214.3" y="103">19</text>
    <text class="num" x="238.1" y="103">20</text>
  </g>
  <rect class="frame" x="12" y="54" width="238" height="55"/>

  <!-- ===== Notes ===== -->
  <rect class="box" x="12" y="113" width="238" height="51"/>
  <text class="lbl" x="16" y="126">NOTES:</text>
  <rect class="frame" x="12" y="113" width="238" height="51"/>

  <!-- ===== Crew served weapon ===== -->
  <!-- 6x9 tracking grid: x=214..250, y=182..238 -->
  <rect class="box" x="12" y="168" width="238" height="70"/>
  <rect class="bar" x="12" y="168" width="238" height="14"/>
  <text class="hdr" x="131" y="178.5" text-anchor="middle">CREW SERVED WEAPON</text>
  <path d="M155 182V238 M214 182V238" stroke="#000" stroke-width="1.2"/>
  <path class="gl" stroke-width="0.4" d="
    M220 182V238 M226 182V238 M232 182V238 M238 182V238 M244 182V238
    M214 188.22H250 M214 194.44H250 M214 200.67H250 M214 206.89H250
    M214 213.11H250 M214 219.33H250 M214 225.56H250 M214 231.78H250"/>
  <text class="sm" x="15" y="193" style="font-size:9.5px">WEAPON / EQUIPMENT:</text>
  <text class="lbl" x="158" y="194">R<tspan font-size="9">V</tspan>:</text>
  <rect class="frame" x="12" y="168" width="238" height="70"/>

  <!-- ===== Sample data (the app will generate this group) ===== -->
  <g id="data">
    <!-- starting strength 16 → boxes 17..20 crossed out -->
    <rect class="crossed" x="154.8" y="88.5" width="95.2" height="20.5"/>
    <path d="M154.8 88.5L250 109 M154.8 109L250 88.5" stroke="#333" stroke-width="0.8" opacity="0.6"/>

    <text class="val" data-field="bp"    x="211" y="43" text-anchor="middle" font-size="16">40</text>
    <text class="val" data-field="name"  x="258" y="44">Rangers</text>
    <text class="val" data-field="type"  x="258" y="89.2">Light Infantry</text>
    <text class="val" data-field="mv"    x="258" y="134.4">3</text>
    <text class="val" data-field="tp"    x="258" y="179.6">1</text>
    <text class="val" data-field="sv"    x="258" y="224.8">4</text>
    <text class="val" data-field="notes" x="16" y="143" font-size="10">
      <tspan x="16">Can garrison buildings</tspan>
      <tspan x="16" dy="13">Ignores rough terrain</tspan>
    </text>

    <text class="val" data-field="weapon" x="15"    y="214" font-size="11">Mortar Team</text>
    <text class="val" data-field="rv"     x="184.5" y="220" text-anchor="middle" font-size="16">2</text>
  </g>
</svg>
