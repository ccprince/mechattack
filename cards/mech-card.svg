<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3.9in" height="5.46in" viewBox="0 0 390 546">
  <!-- Mech record card. 1 viewBox unit = 0.01 inch. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Roboto+Slab:wght@600&amp;display=swap');
    text { font-family: 'Alfa Slab One', 'Rockwell Extra Bold', Rockwell, Georgia, serif; fill: #000; }
    .lbl { font-size: 12px; }
    .hdr { font-size: 9px; }
    .sm { font-size: 7px; }
    .num { font-size: 10px; text-anchor: middle; }
    .title { font-size: 32px; text-anchor: middle; letter-spacing: 1px; }
    .box { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .bar { fill: #b4b4b4; stroke: #000; stroke-width: 1.2; }
    .frame { fill: none; stroke: #000; stroke-width: 1.8; }
    .gl { stroke: #000; stroke-width: 0.6; }
    .val { font-family: 'Roboto Slab', Georgia, serif; font-weight: 600; font-size: 12px; fill: #1a1a1a; }
    .crossed { fill: #555; opacity: 0.45; }
  </style>

  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="390" height="546" rx="4"/></clipPath>

    <!-- Stone texture. SVG filters don't survive svg2pdf, so for PDF export
         this will be swapped for a pre-rendered PNG of the same look. -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="4"/>
      <feColorMatrix type="matrix"
        values="0.6 0.6 0 0 0.02
                0.6 0.6 0 0 0.03
                0.6 0.6 0 0 0.05
                0    0    0 0 1"/>
    </filter>
    <filter id="streaks" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.09" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.12
                0 0 0 0 0.12
                0 0 0 0 0.13
                4.5 0 0 0 -1.9"/>
    </filter>
  </defs>

  <!-- ===== Background texture + outer frame ===== -->
  <g id="texture" clip-path="url(#cardClip)">
    <rect x="0" y="0" width="390" height="546" filter="url(#mottle)"/>
    <g transform="rotate(-38 195 273)">
      <rect x="-180" y="-142" width="750" height="830" filter="url(#streaks)"/>
    </g>
    <!-- title panel backdrop (its outline is drawn below) -->
    <rect x="12" y="12" width="156" height="42" fill="#cfcfcf"/>
    <rect x="12" y="12" width="156" height="42" filter="url(#mottle)" opacity="0.35"/>
  </g>
  <rect x="1" y="1" width="388" height="544" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- ===== Title + BP ===== -->
  <rect x="12" y="12" width="156" height="42" fill="none" stroke="#000" stroke-width="1.2"/>
  <text class="title" x="91" y="45" fill="#fff" style="fill:#fff">MECH</text>
  <text class="title" x="90" y="44">MECH</text>

  <rect class="box" x="172" y="12" width="78" height="42"/>
  <text class="lbl" x="176" y="25">B<tspan font-size="9">P</tspan>:</text>

  <!-- ===== Info column ===== -->
  <rect class="box" x="254" y="12"  width="124" height="36"/>
  <rect class="box" x="254" y="48"  width="124" height="36"/>
  <rect class="box" x="254" y="84"  width="124" height="36"/>
  <rect class="box" x="254" y="120" width="124" height="36"/>
  <rect class="box" x="254" y="156" width="124" height="36"/>
  <rect class="box" x="254" y="192" width="124" height="36"/>
  <rect class="box" x="254" y="228" width="124" height="194"/>
  <text class="lbl" x="258" y="25">NAME:</text>
  <text class="lbl" x="258" y="61">CLASS:</text>
  <text class="lbl" x="258" y="97">M<tspan font-size="9">V</tspan>:</text>
  <text class="lbl" x="258" y="133">T<tspan font-size="9">P</tspan>:</text>
  <text class="lbl" x="258" y="169">H<tspan font-size="9">C</tspan>:</text>
  <text class="lbl" x="258" y="205">ARMOR:</text>
  <text class="lbl" x="258" y="241">NOTES:</text>

  <!-- ===== Armor grid ===== -->
  <!-- cells: columns x=44..250 (10 x 20.6), rows y=90..390 (15 x 20) -->
  <rect class="box" x="12" y="58" width="238" height="364"/>
  <rect class="bar" x="44" y="58"  width="206" height="15"/>
  <rect class="bar" x="44" y="390" width="206" height="15"/>
  <text class="hdr" x="50" y="69">HIT LOCATIONS</text>
  <text class="hdr" x="50" y="401">CRITICAL SYSTEMS AREA</text>

  <g transform="translate(28 74) rotate(-25)">
    <text class="sm" text-anchor="middle" x="0" y="-1" style="font-size:5.5px">ARMOR</text>
    <text class="sm" text-anchor="middle" x="0" y="6" style="font-size:5.5px">GRID</text>
  </g>
  <g transform="translate(28 406) rotate(-25)">
    <text class="sm" text-anchor="middle" x="0" y="-1" style="font-size:5.5px">ARMOR</text>
    <text class="sm" text-anchor="middle" x="0" y="6" style="font-size:5.5px">GRID</text>
  </g>

  <path class="gl" d="
    M64.6 73V390 M85.2 73V390 M105.8 73V390 M126.4 73V390 M147 73V390
    M167.6 73V390 M188.2 73V390 M208.8 73V390 M229.4 73V390
    M64.6 405V422 M85.2 405V422 M105.8 405V422 M126.4 405V422 M147 405V422
    M167.6 405V422 M188.2 405V422 M208.8 405V422 M229.4 405V422
    M12 110H250 M12 130H250 M12 150H250 M12 170H250 M12 190H250
    M12 210H250 M12 230H250 M12 250H250 M12 270H250 M12 290H250
    M12 310H250 M12 330H250 M12 350H250 M12 370H250"/>
  <path d="M44 58V422 M12 90H250 M12 390H250" stroke="#000" stroke-width="1.2"/>

  <g id="hit-numbers">
    <text class="num" x="54.3"  y="86">1</text>
    <text class="num" x="74.9"  y="86">2</text>
    <text class="num" x="95.5"  y="86">3</text>
    <text class="num" x="116.1" y="86">4</text>
    <text class="num" x="136.7" y="86">5</text>
    <text class="num" x="157.3" y="86">6</text>
    <text class="num" x="177.9" y="86">7</text>
    <text class="num" x="198.5" y="86">8</text>
    <text class="num" x="219.1" y="86">9</text>
    <text class="num" x="239.7" y="86">10</text>
  </g>
  <use xlink:href="#hit-numbers" href="#hit-numbers" y="332"/>

  <g id="armor-values">
    <text class="num" x="28" y="104">150</text>
    <text class="num" x="28" y="124">140</text>
    <text class="num" x="28" y="144">130</text>
    <text class="num" x="28" y="164">120</text>
    <text class="num" x="28" y="184">110</text>
    <text class="num" x="28" y="204">100</text>
    <text class="num" x="28" y="224">90</text>
    <text class="num" x="28" y="244">80</text>
    <text class="num" x="28" y="264">70</text>
    <text class="num" x="28" y="284">60</text>
    <text class="num" x="28" y="304">50</text>
    <text class="num" x="28" y="324">40</text>
    <text class="num" x="28" y="344">30</text>
    <text class="num" x="28" y="364">20</text>
    <text class="num" x="28" y="384">10</text>
  </g>

  <rect class="frame" x="12" y="58" width="238" height="364"/>

  <!-- ===== Hardpoints ===== -->
  <rect class="box" x="12" y="426" width="366" height="108"/>
  <rect class="bar" x="12" y="426" width="366" height="14"/>
  <text class="hdr" x="195" y="436.5" text-anchor="middle">HARDPOINTS</text>
  <path d="M12 487H378 M195 440V534" stroke="#000" stroke-width="1.2"/>
  <path class="gl" stroke-width="0.9" d="M95 440V534 M138 440V534 M278 440V534 M321 440V534"/>
  <!-- Dp areas (29 x 47): the app draws each Weapon's Dp here -->
  <rect class="box" x="166" y="440" width="29" height="47"/>
  <rect class="box" x="166" y="487" width="29" height="47"/>
  <rect class="box" x="349" y="440" width="29" height="47"/>
  <rect class="box" x="349" y="487" width="29" height="47"/>

  <text class="sm" x="15"  y="451" style="font-size:7.5px">LEFT ARM:</text>
  <text class="sm" x="15"  y="498" style="font-size:7.5px">LEFT TORSO:</text>
  <text class="sm" x="198" y="451" style="font-size:7.5px">RIGHT ARM:</text>
  <text class="sm" x="198" y="498" style="font-size:7.5px">RIGHT TORSO:</text>
  <g class="lbl">
    <text class="lbl" x="98"  y="452">R<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="141" y="452">H<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="98"  y="499">R<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="141" y="499">H<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="281" y="452">R<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="324" y="452">H<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="281" y="499">R<tspan font-size="9">V</tspan>:</text>
    <text class="lbl" x="324" y="499">H<tspan font-size="9">V</tspan>:</text>
  </g>
  <rect class="frame" x="12" y="426" width="366" height="108"/>

  <!-- ===== Sample data (the app will generate this group) ===== -->
  <g id="data">
    <!-- unused armor layers hatched out: armor 110 → rows 150..120, values included -->
    <rect class="crossed" x="12" y="90" width="238" height="80"/>
    <path d="M12 162L20 170 M12 153L29 170 M12 144L38 170 M12 135L47 170 M12 126L56 170 M12 117L65 170 M12 108L74 170 M12 99L83 170 M12 90L92 170 M21 90L101 170 M30 90L110 170 M39 90L119 170 M48 90L128 170 M57 90L137 170 M66 90L146 170 M75 90L155 170 M84 90L164 170 M93 90L173 170 M102 90L182 170 M111 90L191 170 M120 90L200 170 M129 90L209 170 M138 90L218 170 M147 90L227 170 M156 90L236 170 M165 90L245 170 M174 90L250 166 M183 90L250 157 M192 90L250 148 M201 90L250 139 M210 90L250 130 M219 90L250 121 M228 90L250 112 M237 90L250 103 M246 90L250 94"
          fill="none" stroke="#333" stroke-width="1.1" opacity="0.6"/>

    <text class="val" data-field="bp"    x="211" y="46" text-anchor="middle" style="font-size:16px">185</text>
    <text class="val" data-field="name"  x="258" y="42">Ironclad</text>
    <text class="val" data-field="class" x="258" y="78">Heavy</text>
    <text class="val" data-field="mv"    x="316" y="110" text-anchor="middle" style="font-size:22px">4</text>
    <text class="val" data-field="tp"    x="316" y="146" text-anchor="middle" style="font-size:22px">2</text>
    <text class="val" data-field="hc"    x="316" y="182" text-anchor="middle" style="font-size:22px">3</text>
    <text class="val" data-field="armor" x="258" y="222">110</text>
    <text class="val" data-field="notes" x="258" y="260" style="font-size:11px">
      <tspan x="258">Jump jets (MV +2)</tspan>
      <tspan x="258" dy="14">ECM suite</tspan>
    </text>

    <text class="val" data-field="la-rv" x="116.5" y="474" text-anchor="middle" style="font-size:14px">6/10</text>
    <text class="val" data-field="la-hv" x="152" y="474" text-anchor="middle" style="font-size:14px">2</text>
    <text class="val" data-field="ra-rv" x="299.5" y="474" text-anchor="middle" style="font-size:14px">6/10</text>
    <text class="val" data-field="ra-hv" x="335" y="474" text-anchor="middle" style="font-size:14px">2</text>
    <text class="val" data-field="lt-rv" x="116.5" y="521" text-anchor="middle" style="font-size:14px">8/12</text>
    <text class="val" data-field="lt-hv" x="152" y="521" text-anchor="middle" style="font-size:14px">1</text>
    <text class="val" data-field="rt-rv" x="299.5" y="521" text-anchor="middle" style="font-size:14px">8/12</text>
    <text class="val" data-field="rt-hv" x="335" y="521" text-anchor="middle" style="font-size:14px">1</text>

    <text class="val" data-field="la-weapon" x="15"  y="468.5" style="font-size:12px">Md Laser</text>
    <text class="val" data-field="la-suffix" x="15"  y="481.5" style="font-size:11px">Twin Linked</text>
    <text class="val" data-field="ra-weapon" x="198" y="474" style="font-size:12px">Md Laser</text>
    <text class="val" data-field="lt-weapon" x="15"  y="521" style="font-size:12px">Lt MG</text>
    <text class="val" data-field="rt-weapon" x="198" y="521" style="font-size:12px">Lt MG</text>
  </g>
</svg>
